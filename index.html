<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suggestify AI – Hybrid Recommender</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b1120 0%, #111827 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
        }
        .glass-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -15px rgba(0,0,0,0.3);
        }
        button {
            transition: all 0.2s;
        }
        .star-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #fbbf24;
            transition: transform 0.1s;
        }
        .star-btn:hover { transform: scale(1.2); }
        .star-inactive { opacity: 0.3; filter: grayscale(0.8); }
    </style>
</head>
<body style="padding: 20px; max-width: 1400px; margin: 0 auto;">
    <div id="app">
        <!-- Login view will be injected -->
    </div>
    <script>
        // ---------- MOVIE DATABASE (20 movies) ----------
        const movies = [
            { id:1, title:"Blade Runner", description:"A blade runner hunts replicants in dystopian 2019 Los Angeles.", category:"Sci-Fi", avg_rating:4.5, year:1982 },
            { id:2, title:"The Terminator", description:"A cyborg assassin is sent back in time to kill Sarah Connor.", category:"Action", avg_rating:4.3, year:1984 },
            { id:3, title:"When Harry Met Sally", description:"Can a man and woman be just friends? Harry and Sally find out.", category:"Romance", avg_rating:4.1, year:1989 },
            { id:4, title:"Interstellar", description:"Astronauts traverse a wormhole searching for a new home for humanity.", category:"Sci-Fi", avg_rating:4.6, year:2014 },
            { id:5, title:"Titanic", description:"An aristocrat and a poor artist fall in love on the doomed ocean liner.", category:"Romance", avg_rating:4.2, year:1997 },
            { id:6, title:"The Matrix", description:"A hacker discovers reality is a simulation and joins the resistance.", category:"Sci-Fi", avg_rating:4.7, year:1999 },
            { id:7, title:"Inception", description:"A thief plants an idea into a target's subconscious through dream invasion.", category:"Sci-Fi", avg_rating:4.5, year:2010 },
            { id:8, title:"Mad Max: Fury Road", description:"In a wasteland, Furiosa leads a rebellion against a tyrannical warlord.", category:"Action", avg_rating:4.4, year:2015 },
            { id:9, title:"La La Land", description:"A musician and actress pursue their dreams while falling in love in LA.", category:"Romance", avg_rating:4.0, year:2016 },
            { id:10, title:"Gravity", description:"Two astronauts struggle to survive adrift in space after an accident.", category:"Sci-Fi", avg_rating:3.9, year:2013 },
            { id:11, title:"John Wick", description:"A retired hitman goes on a rampage after his dog is killed.", category:"Action", avg_rating:4.2, year:2014 },
            { id:12, title:"Pride & Prejudice", description:"Elizabeth Bennet navigates love, pride, and prejudice with Mr. Darcy.", category:"Romance", avg_rating:4.3, year:2005 },
            { id:13, title:"Arrival", description:"A linguist deciphers alien language that reveals a shocking truth about time.", category:"Sci-Fi", avg_rating:4.4, year:2016 },
            { id:14, title:"The Dark Knight", description:"Batman battles the Joker, a chaotic criminal genius, in Gotham City.", category:"Action", avg_rating:4.7, year:2008 },
            { id:15, title:"Eternal Sunshine", description:"A couple erases each other from memory after their relationship ends.", category:"Romance", avg_rating:4.4, year:2004 },
            { id:16, title:"Ex Machina", description:"A programmer tests an AI with artificial consciousness and human-like behavior.", category:"Sci-Fi", avg_rating:4.2, year:2014 },
            { id:17, title:"Speed", description:"A bomb on a bus will explode if it drops below 50 mph.", category:"Action", avg_rating:3.8, year:1994 },
            { id:18, title:"Sense and Sensibility", description:"The Dashwood sisters navigate romance, heartbreak, and societal expectations.", category:"Romance", avg_rating:3.9, year:1995 },
            { id:19, title:"Dune", description:"Paul Atreides leads desert tribes in a revolt to control the universe's most precious resource.", category:"Sci-Fi", avg_rating:4.3, year:2021 },
            { id:20, title:"Top Gun: Maverick", description:"Maverick trains elite pilots for a dangerous mission thirty years later.", category:"Action", avg_rating:4.5, year:2022 }
        ];

        // ---------- HELPER: Hybrid score (60% collab + 40% content) ----------
        function computeHybridScore(movie, ratings, allMovies) {
            // Collaborative: normalize global avg rating from 1-5 to 0-1
            const collabScore = (movie.avg_rating - 1) / 4;
            let contentScore = 0.3; // default if no rated movies
            const ratedIds = Object.keys(ratings).map(Number);
            if (ratedIds.length > 0) {
                const highRated = ratedIds.filter(id => ratings[id] >= 4);
                if (highRated.length > 0) {
                    const catCount = {};
                    highRated.forEach(id => {
                        const m = allMovies.find(x => x.id === id);
                        if (m) catCount[m.category] = (catCount[m.category] || 0) + 1;
                    });
                    const favCat = Object.entries(catCount).sort((a,b) => b[1] - a[1])[0][0];
                    contentScore = (movie.category === favCat) ? 1.0 : 0.3;
                }
            }
            return (collabScore * 0.6) + (contentScore * 0.4);
        }

        // ---------- STATE ----------
        let currentUser = null;          // { email, name }
        let userRatings = {};             // { movieId: rating }
        let toastTimeout = null;

        // DOM elements
        const appDiv = document.getElementById('app');

        // ---------- RENDER LOGIN ----------
        function renderLogin() {
            appDiv.innerHTML = `
                <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;">
                    <div class="glass" style="max-width: 420px; width: 100%; padding: 40px; text-align: center;">
                        <h1 style="font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #34d399); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 12px;">Suggestify AI</h1>
                        <p style="color: #94a3b8; margin-bottom: 32px;">Hybrid ML recommendation engine</p>
                        <div style="text-align: left;">
                            <label style="display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Email</label>
                            <input type="email" id="loginEmail" placeholder="you@example.com" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 12px; color: white; margin-bottom: 20px;">
                            <label style="display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px;">Name</label>
                            <input type="text" id="loginName" placeholder="Alex Chen" style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #334155; border-radius: 12px; color: white; margin-bottom: 28px;">
                        </div>
                        <button id="loginBtn" style="background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; color: white; font-weight: 600; padding: 12px 24px; border-radius: 40px; width: 100%; cursor: pointer;">Enter Suggestify →</button>
                    </div>
                </div>
            `;
            document.getElementById('loginBtn').addEventListener('click', () => {
                const email = document.getElementById('loginEmail').value.trim();
                const name = document.getElementById('loginName').value.trim() || email.split('@')[0];
                if (!email.includes('@')) {
                    showToast('Enter a valid email', true);
                    return;
                }
                currentUser = { email, name };
                // Load ratings from localStorage for this email
                const stored = localStorage.getItem(`ratings_${email}`);
                if (stored) {
                    userRatings = JSON.parse(stored);
                } else {
                    userRatings = {};
                }
                renderDashboard();
            });
        }

        // ---------- TOAST ----------
        function showToast(msg, isError = false) {
            let toastDiv = document.getElementById('global-toast');
            if (!toastDiv) {
                toastDiv = document.createElement('div');
                toastDiv.id = 'global-toast';
                toastDiv.style.position = 'fixed';
                toastDiv.style.bottom = '30px';
                toastDiv.style.left = '50%';
                toastDiv.style.transform = 'translateX(-50%)';
                toastDiv.style.backgroundColor = 'rgba(0,0,0,0.8)';
                toastDiv.style.backdropFilter = 'blur(12px)';
                toastDiv.style.padding = '10px 20px';
                toastDiv.style.borderRadius = '40px';
                toastDiv.style.color = 'white';
                toastDiv.style.fontSize = '14px';
                toastDiv.style.zIndex = '9999';
                toastDiv.style.border = '1px solid rgba(168,85,247,0.3)';
                document.body.appendChild(toastDiv);
            }
            toastDiv.textContent = msg;
            toastDiv.style.display = 'block';
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastDiv.style.display = 'none';
            }, 2500);
        }

        // ---------- RENDER DASHBOARD ----------
        function renderDashboard() {
            const ratedIds = Object.keys(userRatings).map(Number);
            // Compute hybrid score for unwatched movies, get top 12
            let recommendations = movies
                .filter(m => !ratedIds.includes(m.id))
                .map(m => ({ ...m, score: computeHybridScore(m, userRatings, movies) }))
                .sort((a,b) => b.score - a.score)
                .slice(0, 12);
            
            if (recommendations.length === 0) {
                // if all rated, show top rated overall
                recommendations = movies
                    .map(m => ({ ...m, score: computeHybridScore(m, userRatings, movies) }))
                    .sort((a,b) => b.score - a.score)
                    .slice(0, 12);
            }

            // Favorite genre from high ratings (>=4)
            let favGenre = '—';
            const highRated = ratedIds.filter(id => userRatings[id] >= 4);
            if (highRated.length) {
                const catCount = {};
                highRated.forEach(id => {
                    const m = movies.find(x => x.id === id);
                    if (m) catCount[m.category] = (catCount[m.category] || 0) + 1;
                });
                const top = Object.entries(catCount).sort((a,b)=>b[1]-a[1])[0];
                if (top) favGenre = top[0];
            }

            const avgRating = ratedIds.length ? (ratedIds.reduce((s,id)=>s+userRatings[id],0)/ratedIds.length).toFixed(1) : '—';

            const categoryColors = { 'Sci-Fi':'#a78bfa', 'Action':'#fb923c', 'Romance':'#f472b6' };
            
            appDiv.innerHTML = `
                <div style="padding: 20px 24px;">
                    <!-- Navbar -->
                    <div class="glass" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; margin-bottom: 32px; border-radius: 60px;">
                        <div style="font-weight: 800; font-size: 24px; background: linear-gradient(135deg, #a78bfa, #34d399); -webkit-background-clip: text; background-clip: text; color: transparent;">Suggestify AI</div>
                        <div style="display: flex; gap: 16px; align-items: center;">
                            <div style="background: linear-gradient(135deg, #6366f1, #34d399); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">${currentUser.name[0].toUpperCase()}</div>
                            <span>${currentUser.name}</span>
                            <button id="logoutBtn" style="background: none; border: 1px solid #334155; padding: 6px 14px; border-radius: 30px; color: #cbd5e1; cursor: pointer;">Sign out</button>
                        </div>
                    </div>

                    <!-- Hero -->
                    <div style="margin-bottom: 32px;">
                        <h2 style="font-size: 32px; font-weight: 700;">Good to see you, <span style="background: linear-gradient(135deg,#a78bfa,#34d399); -webkit-background-clip:text; background-clip:text; color:transparent;">${currentUser.name.split(' ')[0]}</span> 👋</h2>
                        <p style="color: #94a3b8;">Your hybrid AI picks · 60% collaborative + 40% content-based</p>
                    </div>

                    <!-- Stats -->
                    <div style="display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 40px;">
                        <div class="glass" style="padding: 12px 24px; border-radius: 20px;"><div style="font-size: 12px; color:#64748b;">RATED</div><div style="font-size: 28px; font-weight: 700;">${ratedIds.length}</div></div>
                        <div class="glass" style="padding: 12px 24px; border-radius: 20px;"><div style="font-size: 12px; color:#64748b;">AVG RATING</div><div style="font-size: 28px; font-weight: 700;">${avgRating}</div></div>
                        <div class="glass" style="padding: 12px 24px; border-radius: 20px;"><div style="font-size: 12px; color:#64748b;">TOP GENRE</div><div style="font-size: 28px; font-weight: 700;">${favGenre}</div></div>
                        <div class="glass" style="padding: 12px 24px; border-radius: 20px;"><div style="font-size: 12px; color:#64748b;">MOVIES</div><div style="font-size: 28px; font-weight: 700;">${movies.length}</div></div>
                    </div>

                    <!-- Recommendations grid -->
                    <h3 style="font-size: 22px; font-weight: 600; margin-bottom: 20px;">🎬 Recommended for you</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;">
                        ${recommendations.map(movie => {
                            const userRating = userRatings[movie.id] || 0;
                            const scorePercent = Math.round(movie.score * 100);
                            const accent = categoryColors[movie.category] || '#a78bfa';
                            return `
                                <div class="glass-card" style="border-radius: 24px; overflow: hidden; display: flex; flex-direction: column;">
                                    <div style="height: 4px; background: linear-gradient(90deg, ${accent}, #34d399);"></div>
                                    <div style="padding: 20px;">
                                        <div style="font-size: 12px; color: ${accent}; letter-spacing: 1px; margin-bottom: 8px;">${movie.category}</div>
                                        <div style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">${movie.title}</div>
                                        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">${movie.year}</div>
                                        <div style="font-size: 13px; color: #9ca3af; line-height: 1.5; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">${movie.description}</div>
                                        ${userRating === 0 ? `
                                            <div style="margin-bottom: 14px;">
                                                <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px;"><span>Match score</span><span>${scorePercent}%</span></div>
                                                <div style="height: 4px; background: #1e293b; border-radius: 4px; overflow: hidden;"><div style="width: ${scorePercent}%; height: 100%; background: linear-gradient(90deg, #6366f1, #34d399); border-radius: 4px;"></div></div>
                                            </div>
                                        ` : `
                                            <div style="margin-bottom: 14px; font-size: 13px;">Your rating: ${'⭐'.repeat(userRating)}</div>
                                        `}
                                        <div style="display: flex; gap: 6px;" id="stars-${movie.id}">
                                            ${[1,2,3,4,5].map(s => `
                                                <button class="star-btn ${userRating >= s ? '' : 'star-inactive'}" data-movie="${movie.id}" data-star="${s}" style="font-size: 24px;">★</button>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            // Attach rating events
            recommendations.forEach(movie => {
                for (let s=1; s<=5; s++) {
                    const btn = document.querySelector(`.star-btn[data-movie="${movie.id}"][data-star="${s}"]`);
                    if (btn) {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const movieId = parseInt(btn.dataset.movie);
                            const star = parseInt(btn.dataset.star);
                            rateMovie(movieId, star);
                        });
                    }
                }
            });

            document.getElementById('logoutBtn').addEventListener('click', () => {
                currentUser = null;
                userRatings = {};
                renderLogin();
            });
        }

        function rateMovie(movieId, rating) {
            if (!currentUser) return;
            // Update state
            userRatings[movieId] = rating;
            // Persist to localStorage
            localStorage.setItem(`ratings_${currentUser.email}`, JSON.stringify(userRatings));
            showToast(`⭐ Rated ${rating} star${rating > 1 ? 's' : ''}!`, false);
            // Re-render dashboard to reflect new ratings and updated recommendations
            renderDashboard();
        }

        // Start the app
        renderLogin();
    </script>
</body>
</html>
